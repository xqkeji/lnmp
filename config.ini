# ============================================================================
# config.ini - LNMP 一键安装的版本配置
#
# 用法：与 install.sh 放同一目录，改完直接执行 ./install.sh
# 语法：key=value ；# 开头为注释；值不要加引号
# 说明：下面每个版本都标注了"为什么选它"，升级时照着查即可
#
# 支持系统（lib/os.sh 自动探测，按包管理器分家族）：
#   debian 家族：Debian 11/12/13、Ubuntu 20.04/22.04/24.04 及衍生版（apt）
#   rhel   家族：RHEL/Rocky/AlmaLinux/CentOS 8/9、Fedora、openEuler 22.03/24.03（dnf/yum）
#   rhel 家族会自动启用 EPEL / CRB 仓库（oniguruma、libsodium 等 PHP 依赖来自那里）；
#   openEuler 没有 EPEL，其自带源已含这些包，启用失败仅告警不中断。
# nginx / PHP 全家族源码编译；MongoDB 用官方预编译 tarball（构建名按系统自动映射，
#   见 mongodb_distro 说明）。
# ============================================================================

# ----------------------------------------------------------------------------
# nginx
# ----------------------------------------------------------------------------
# 安装方式：src = 源码编译（默认；acme 模块源码走 config.ini 的 nginx_acme_url，
#          失败自动回退 GitHub 代理/直连与 git clone）
#          apt = nginx.org 官方 apt 包（附带预编译 acme 模块，无需 Rust，但国内走镜像）
# 两种路线互斥：动态模块必须与 nginx 同构建，不能混用，切换时已装的另一路线会被自动清理。
# 注意：apt 路线仅有 deb 包，支持 Debian/Ubuntu；RHEL/Rocky/openEuler 等
#       必须保持 src（填了 apt 会在预检时报错中止）。
nginx_install=src

# apt 路线专用：nginx.org apt 仓库地址。留空 = 脚本自动依次尝试
#   清华 TUNA 镜像 -> 南阳理工 nyist 镜像 -> nginx.org 官方源（前两个国内快）
# Debian 与 Ubuntu 会自动选用仓库路径的 debian / ubuntu 子目录。
# 想强制用官方源就填：nginx_apt_repo=https://nginx.org/packages/debian
# 想用其它镜像填其 deb 仓库根即可（如 https://mirrors.tuna.tsinghua.edu.cn/nginx/debian）
nginx_apt_repo=

# stable 分支版本（仅显示/最低版本参考用，apt 路线实际版本由仓库决定）
# 版本清单：https://nginx.org/en/download.html
nginx=1.30.6
# 下载后校验 sha256（仅 src 路线使用），留空则跳过校验
nginx_sha256=3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8

# ----------------------------------------------------------------------------
# ngx_http_acme_module（nginx 官方 ACME 动态模块）
# apt 路线：由 nginx-module-acme 包提供（已编译好，与 nginx 同版本 ABI 匹配）
# src 路线：GitHub: nginx/nginx-acme ；仅支持 HTTP-01，不支持 DNS-01 / 通配符
#           编译依赖 Rust>=1.81（脚本自动 rustup 装）+ libclang-dev
# 下方 nginx_acme 非空即表示"启用 acme 自动 HTTPS"；0.4.1 为当前版本号
# ----------------------------------------------------------------------------
nginx_acme=0.4.1
# 校验用 sha256（留空=跳过）。注意：各镜像源的归档 tar 元数据可能随请求变化，
# 且同版本号在不同源字节不同，pin 死易误判，故此处留空，由归档完整性兜底。
# （apt 路线此字段同样忽略，由 nginx-module-acme 包自带签名来源保证）
nginx_acme_sha256=

# ACME / Let's Encrypt 申请证书用的联系邮箱（到期/失效通知）
acme_contact=xqkeji@foxmail.com
# 自动签发 HTTPS 的域名（空格分隔；当前为 xqkeji.cn 主域 + www）
acme_domains=xqkeji.cn www.xqkeji.cn

# ===== 以下两项仅 src 路线（nginx_install=src）使用，apt 路线忽略 =====
# ngx_http_acme_module 下载源。默认用 gitcode 归档（国内首选）：
nginx_acme_url=https://raw.gitcode.com/xqkeji/nginx-acme/archive/refs/heads/v0.4.1.tar.gz
#   ⚠️ 必须带 .tar.gz 后缀，直连 gitcode 归档（顶层目录 nginx-acme-v0.4.1/）；
#      用 gitcode 替代 Gitee，规避 Gitee 归档重定向到 .zip 致使 tar 解压失败。
#      但 gitcode 归档的反爬按出口 IP 判：云主机段即使带浏览器 UA 也会 418，
#      此时脚本自动继续走 GitHub 代理/直连，最后兜底 git clone，不用手工干预。
# 备选：GitHub 代理前缀（替换 github.com 部分，ghproxy 类写法），留空则不走代理
#   nginx_acme_mirror=https://ghproxy.net/https://github.com
nginx_acme_mirror=

# 编译 ngx_http_acme_module 所需的 Rust 工具链镜像
# 留空 = 默认用国内镜像 rsproxy.cn（推荐，官方源国内很慢）
# 想绕开镜像填官方源：rust_dist_server=https://static.rust-lang.org
#                     rust_update_root=https://static.rust-lang.org/rustup
rust_dist_server=
rust_update_root=

# ----------------------------------------------------------------------------
# MongoDB
# ----------------------------------------------------------------------------
# 实测 fastdl 上可下载的构建为 8.3.13（8.0.x 在该源已不可用）
# 注意：官方只发预编译 tarball，没有源码编译这回事，所以这里是"下载+解压"
mongodb=8.3.13
# 官方 tarball 按发行版分发不同构建（构建名以官方 current.json 的 target 为准）。
# auto = 按当前系统自动挑，且首选构建不可用时会自动回退重试：
#   Debian 12 -> debian12（11 用 debian11，13+ 回退 debian12，glibc 向前兼容）；
#   Ubuntu 20.04/22.04/24.04+ -> ubuntu2004/2204/2404（再回退 debian12）；
#   RHEL/Rocky/Alma 9 -> rhel93（9.3+ 构建，el9 均可跑），8 -> rhel8，10 -> rhel10；
#   openEuler 无官方构建：先试 rhel8（glibc 基线最低，22.03+ 实测可跑），失败自动换 rhel93。
# 想强制指定就填官方构建名，如 mongodb_distro=debian12
mongodb_distro=auto
# 注意：sha256 与构建名绑定，跨构建回退时若此处 pin 了校验值会失配；
# 留空（默认）由 tarball 解压完整性兜底，多构建自动回退不受影响。
# 留空=跳过 sha256 校验；如需校验请填对应构建 tarball 的 sha256
# （如 debian12 构建 mongodb-linux-x86_64-debian12-8.3.13.tgz 的 sha256 为
#   c62cb4bccf2357ddd449c2b9418ce0d8b9c05798b0d3081d04b09f130503f993；
#   一旦 pin 死，其它构建（ubuntu/rhel 回退）校验必然失配，慎用）
mongodb_sha256=
# MongoDB 6.0+ 的 tarball 里已经不含 mongosh（mongo shell），只有 mongod/mongos。
# 需要命令行客户端就填版本号，脚本会单独下载装到 /usr/local/mongodb/bin；
# 留空则不安装。
mongosh=2.14.0

# MongoDB 初始账号（仿 wnmmp：root / xqkeji.cn）
# 两个都留空则跳过账号初始化（保持无认证裸跑）
mongodb_root_user=root
mongodb_root_pass=xqkeji.cn

# ----------------------------------------------------------------------------
# PHP
# ----------------------------------------------------------------------------
# 必须与下面 xqkeji 的 -phpX.Y 后缀对上，否则 xqkeji.so 加载不了
php=8.5.12
php_sha256=81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525

# ----------------------------------------------------------------------------
# xqkeji 扩展
# ----------------------------------------------------------------------------
# gitee 仓库 xqkeji/php-xqkeji 的 tag 名
#
# 两个反直觉的点，决定了它不能按常规方式装：
#   1. 仓库里只有预编译二进制（xqkeji.so / php_xqkeji.dll），没有 C 源码
#      -> 没法 phpize 编译，只能把 .so 直接放进 extension_dir
#   2. 它没发布到 packagist
#      -> PIE 也装不了
# v1.1.6 是当前最新 tag，只兼容 PHP 8.5.x（下载源已切到 gitcode 归档）
xqkeji=v1.1.6-php8.5
# 下载源覆盖（可选）：填自己镜像的完整 URL。留空则脚本按
#   gitcode 归档（首选）-> GitHub 国内代理 -> GitHub 直连 -> git clone 依次回退。
# 注意：各源的归档字节不同，脚本对 xqkeji 不做 sha256 校验，靠解压完整性兜底。
# gitcode 归档的反爬按出口 IP 判：云主机段即使带浏览器 UA 也会返回 418（同一条
# 链接在本地浏览器里正常下载），脚本对此的兜底是 git clone；再不行就把包手动传到
# /usr/local/src/lnmp/php-xqkeji-<tag>.tar.gz（存在即跳过下载），或填本项。
xqkeji_url=

# ----------------------------------------------------------------------------
# Composer / PIE
# ----------------------------------------------------------------------------
composer=2.10.3
pie=1.5.3

# ----------------------------------------------------------------------------
# 通过 PIE 安装的 PHP 扩展（空格分隔）
# ----------------------------------------------------------------------------
# 必须用 packagist 上的 php-ext 包名，不能用 PECL 短名：
#   zip     -> pecl/zip
#   mongodb -> mongodb/mongodb-extension   （mongodb/mongodb 是纯 PHP 库，不是扩展）
#
# 关于 gd：它是 PHP 核心 bundled 扩展，packagist 上根本没有 php-ext/gd 包，
#          PIE 装不了。本脚本改成在 PHP 编译期用 --enable-gd 打开。
pie_extensions=pecl/zip mongodb/mongodb-extension

# ----------------------------------------------------------------------------
# ocserv（OpenConnect / Cisco AnyConnect 兼容 SSL VPN 服务端）
# ----------------------------------------------------------------------------
# 官网（infradead）源码编译安装。注意 1.5 起官方只发布 meson 构建的 tar.xz，
# 脚本已适配（依赖 meson/ninja，00-deps.sh 的 ocserv 组自动安装）。
# 下载/校验：https://www.infradead.org/ocserv/download.html
ocserv=1.6.0
ocserv_sha256=2d3303a0d9e06eabfa08694b9dca3c558fef36418857bebf1b8de57ece5f9f32
# 下载源覆盖（可选）：官网只走 ftp:// 协议，个别网络不通时可填镜像站完整 URL
ocserv_url=
# 监听端口（tcp+udp 同一个）。客户端地址要写 vpn.example.com:4443。
# ocserv 装完后 78-firewall.sh 会自动收紧主机防火墙（firewalld/iptables 双路径）：
#   对外只放行 80 / 443 / 本端口，其余端口（含 27017）全部拒绝；
#   22/SSH 只允许本机回环与 ocserv_network 段（即必须先连上 VPN 才能 SSH）。
#   ocserv 未运行时不会收紧 22（防止远程失联）。还原：sudo ./scripts/78-firewall.sh undo
ocserv_port=4443
# 分配给 VPN 客户端的内网地址段（ocserv 的 ipv4-network/netmask）
ocserv_network=10.10.10.0
ocserv_netmask=255.255.255.0
# 下发给客户端的 DNS（空格分隔，可多组）：这里配的是公网 DNS
ocserv_dns=119.29.29.29 223.5.5.5
# 初始 VPN 账号。留空且在执行终端（有 tty）会交互式提示输用户名/密码；
# 非交互场景（管道/cron）填这两项自动建号；都留空则跳过，之后手动：
#   ocpasswd -c /etc/ocserv/ocpasswd <用户名>
ocserv_user=
ocserv_pass=

# ----------------------------------------------------------------------------
# 其他
# ----------------------------------------------------------------------------
# Packagist 镜像，留空用官方源；国内机器可填 https://mirrors.aliyun.com/composer/
composer_mirror=
# 并行编译线程数，留空 = CPU 核心数
jobs=
